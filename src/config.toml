# Config file

name = "Tätigkeitsbericht"
version = "1.0.0"

[database]
type = "sqlite"
path = "myapp.db"



[sollstunden]
wochenstunden = [
    { wochentag = 1, stunden = "4:00", name = "Montag" },
    { wochentag = 2, stunden = "4:00", name = "Dienstag" },
    { wochentag = 3, stunden = "4:00", name = "Mittwoch" },
    { wochentag = 4, stunden = "4:00", name = "Donnerstag" },
    { wochentag = 5, stunden = "0:00", name = "Freitag" },
    { wochentag = 6, stunden = "0:00", name = "Samstag" },
    { wochentag = 7, stunden = "0:00", name = "Sonntag" },
]
wochenstunden_regel = 40
wochenstunden_max = 48
wochenstunden_summe = 16
sollstunden_an_feiertagen = false 
kommentar_urlaubstage = "U"
kommentar_krankheitstage = "K"
kommentar_ueberstunden_frei = "Ü-Frei" 
prefix_kommentar_feiertage = "F:"
prefix_kommentar_betriebsferientage = "B:" 




# Zeiteintrag-Tabelle (GUI): Spaltenindex 0–19 (ZeiteintragTableModel.HEADERS).
# [zeiteintrag_tabelle]: ausgeblendete_spalten, grauer_hintergrund_spalten (siehe Abschnitt unten).
# Nur ausgeblendete_spalten verbergen Spalten in der GUI; Daten bleiben im Modell.
# [zeiteintrag_excel_export].cell_spec verweist auf dieselben Indizes (0–19).
#
#   0  Tag              — Wochentag (Mo–So), aus Datum, nur Anzeige
#   1  Datum            — DD.MM.YYYY, bearbeitbar
#   2  F                — Feiertag (Stern-Icon), nur Anzeige
#   3  U                — Urlaub (Icon), nur Anzeige
#   4  K                — Krank (Icon), nur Anzeige
#   5  Sz               — Schulferien (Icon), nur Anzeige
#   6  Bf               — Betriebsferien (Icon), nur Anzeige
#   7  Von              — Arbeitsbeginn HH:MM
#   8  Bis              — Arbeitsende HH:MM
#   9  Von              — Pause 1 Beginn (optional)
#  10  Bis              — Pause 1 Ende (optional)
#  11  Von              — Pause 2 Beginn (optional)
#  12  Bis              — Pause 2 Ende (optional)
#  13  Geleistet        — berechnet / Anwendungsschicht, nur Anzeige
#  14  Soll             — Soll nach Stundenplan, nur Anzeige
#  15  Vertrag          — Soll nach Vertrag (Zeile 1 je Tag), nur Anzeige
#  16  Kommentar        — Freitext max. 80 Zeichen, bearbeitbar
#  17  Tag              — Kalendertag als Text fuer Excel (z. B. „7.“), nur Anzeige
#  18  Feiertagsname    — Name des Feiertags, nur Anzeige
#  19  Schulferienname  — Name der Schulferien, nur Anzeige
#


# Stundenplan: Spalten 0–8 nur ausblenden (0 Wochentag, 1–2 Arbeitsphase, 3–4 Pause, 5–6 Pause 2, 7 Soll, 8 Kommentar).
[stundenplan_tabelle]
ausgeblendete_spalten = []


[zeiteintrag_tabelle]
# Spalte 17 = Kalendertag fuer Excel (nur Export, bleibt fuer cell_spec erhalten)
ausgeblendete_spalten = [17,18,19]
# Status-Kennzeichen (F, U, K, Sf, Bf) mit gleichem Grau wie Wochenendzeilen (#eeeeee).
# Leere Liste [] = keine graue Hervorhebung; weglassen = Standard [2, 3, 4, 5, 6].
grauer_hintergrund_spalten = [2, 3, 4, 5, 6]


# Zeiteintrag: Button „Fuer Excel kopieren“ (tab-getrennte Zwischenablage).
#
# cell_spec — Spaltenreihenfolge beim Einfuegen in Excel (Quellindices 0…19):
#   - Zahl = Wert aus dieser Tabellenspalte (z. B. 0 Wochentag, 17 Kalendertag, 7 Von, 8 Bis, 16 Kommentar)
#   - "blank" = leere Zelle: vorhandene Excel-Zellen an dieser Position nicht ueberschreiben
#     (in Excel: Einfuegen > Inhalte einfuegen > Leerzellen ueberspringen)
# Beispiel unten: Mo, Tag, Von…Bis/Pausen, [Geleistet], [Soll], Kommentar
# include_header — true: erste Zeile mit den gleichen Spaltennamen wie im Modell.
# leading_empty_columns / trailing_empty_columns — zusaetzliche leere Spalten am Rand jeder Zeile.
# uhrzeit_spalten — Excel-Datentyp Uhrzeit (TSV: Tagesbruchteil, HTML: HH:MM:SS)
# datum_spalten — Excel-Datentyp Datum (TSV: Serienzahl, HTML: DD.MM.YYYY)
# integer_spalten / float_spalten — Excel-Zahl (leer = keine Spalte)
# text_spalten — Excel-Datentyp Text (z. B. [17] Kalendertag „7.“)
# html_formatierung — false: nur TSV; bei „blank“ in cell_spec immer nur TSV (Leerzellen ueberspringen)
# Pro Spaltenindex nur in einer Typ-Liste; Aenderungen an cell_spec gelten nach Speichern sofort.
#
[zeiteintrag_excel_export]
include_header = false
leading_empty_columns = 0
trailing_empty_columns = 0
html_formatierung = true
uhrzeit_spalten = [7, 8, 9, 10, 11, 12]
datum_spalten = [1]
integer_spalten = []
float_spalten = []
text_spalten = [17]
cell_spec = [ 0, 17, 7, 8, 9, 10, 11, 12, "blank", "blank", 16]

